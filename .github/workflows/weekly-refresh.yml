name: Weekly football refresh

on:
  schedule:
    - cron: '0 8 * * 2'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      season:
        description: NFL season (not calendar year)
        required: true
        default: '2026'

permissions:
  contents: read

concurrency:
  group: football-refresh-production
  cancel-in-progress: false

jobs:
  refresh:
    # Opt-in only, after cloud smoke tests and owner recovery-key verification.
    if: github.ref == 'refs/heads/main' && vars.ENABLE_WEEKLY_REFRESH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.REFRESH_DATABASE_URL }}
      # libpq (psycopg and pg_dump) verifies the Supabase server certificate with this CA.
      PGSSLROOTCERT: ${{ github.workspace }}/backend/certs/supabase-ca.crt
      BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
      MODEL_DIR: ./artifacts/models
      NFL_SEASON: ${{ inputs.season || '2026' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: backend/.python-version
      - name: Install worker and encryption tool
        run: |
          python -m pip install '.[worker]'
          sudo apt-get update -qq
          sudo apt-get install -y age postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          test -x /usr/lib/postgresql/17/bin/pg_dump
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Validate configuration before any database writes
        run: |
          python -m src.jobs.refresh_preflight
      - name: Refresh canonical data and publish intended week
        id: refresh
        continue-on-error: true
        run: python -m src.jobs.weekly_refresh --season "$NFL_SEASON"
      - name: Encrypt exact replay inputs (never re-download on upload retry)
        id: replay
        if: ${{ !cancelled() && steps.refresh.outcome == 'success' }}
        continue-on-error: true
        run: python -m src.jobs.archive_refresh replay
      - name: Create and encrypt portable PostgreSQL backup
        id: backup
        if: ${{ !cancelled() && steps.refresh.outcome != '' }}
        continue-on-error: true
        run: python -m src.jobs.archive_refresh backup
      - name: Upload encrypted files only
        id: upload1
        if: ${{ !cancelled() && steps.backup.outcome != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: football-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/data/encrypted/*.age
            backend/data/encrypted/*.sha256.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: true
      - name: Retry same encrypted upload
        id: upload2
        if: ${{ !cancelled() && steps.upload1.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: football-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/data/encrypted/*.age
            backend/data/encrypted/*.sha256.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: true
      - name: Download uploaded archive for checksum verification
        id: download
        if: ${{ !cancelled() && (steps.upload1.outcome == 'success' || steps.upload2.outcome == 'success') }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: football-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/data/download-check
      - name: Verify downloaded encrypted files
        id: verify
        if: ${{ !cancelled() && steps.download.outcome == 'success' }}
        continue-on-error: true
        run: python -m src.jobs.archive_refresh verify --output data/download-check
      - name: Report separate publication and archive outcomes
        if: ${{ !cancelled() && steps.refresh.outcome != '' }}
        env:
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
          BACKUP_OUTCOME: ${{ steps.backup.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: python -m src.jobs.refresh_result summary

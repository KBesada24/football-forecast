[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "football-forecast-backend"
version = "0.1.0"
description = "NFL full-PPR forecasting data pipeline and API"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "psycopg[binary]==3.3.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
]

[project.optional-dependencies]
worker = [
    "alembic==1.20.0",
    "nflreadpy==0.1.5",
    "polars==1.44.2",
    "pyyaml==6.0.3",
]
local = ["uvicorn[standard]==0.52.4"]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.vercel]
entrypoint = "src.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
